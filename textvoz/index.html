<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TextVoz leitor de texto</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"/>
  <link rel="stylesheet" href="styles.css" />
</head>
<body id="body">
  <header>
    <img src="img/texto-para-fala.png" alt="Ícone" />
    TextVoz
  </header>
  <main>
    <div class="container">
      <p>O <span>TextVoz</span> é uma ferramenta online que ajuda quem está aprendendo uma nova língua...</p>
      <textarea id="textInput" placeholder="Digite ou cole o texto aqui..." class="text-light"></textarea>
      <div class="buttons">
        <select id="languageSelect">
          <option value="pt-BR">Português (BR)</option>
          <option value="es-ES">Español (ES)</option>
          <option value="en-US">English (US)</option>
          <option value="de-DE">Deutsch (DE)</option>
          <option value="it-IT">Italian (IT)</option>
          <option value="fr-FR">French (FR)</option>
          <option value="id-ID">Indonesian (ID)</option>
        </select>
        <div class="btn-group">
          <button onclick="speakText()" title="Falar"><i class="fas fa-volume-up"></i></button>
          <button id="pauseResumeBtn" onclick="togglePauseResume()" title="Pausar/Retomar"><i class="fas fa-pause"></i></button>
          <button onclick="clearText()" title="Limpar"><i class="fas fa-trash"></i></button>
          <button id="toggleBtn" class="toggle-btn" onclick="toggleMode()" title="Modo Escuro/Claro">
            <i class="fas fa-moon"></i>
          </button>
        </div>
      </div>
    </div>
  </main>
  <footer>
    Developed by Julio Gonzales
    <div class="social-icons">
      <a href="https://github.com/Julioheyner" target="_blank"><i class="fab fa-github"></i></a>
      <a href="https://wa.me" target="_blank"><i class="fab fa-whatsapp"></i></a>
      <a href="https://portfolio-modo-dark.vercel.app/" target="_blank"><i class="fas fa-briefcase"></i></a>
    </div>
  </footer>
  <script src="script.js"></script>
</body>
</html>
